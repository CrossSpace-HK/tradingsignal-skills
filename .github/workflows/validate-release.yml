name: Validate Skill release

on:
  pull_request:
  push:
    branches: [main]

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify version, package copy, and content digest
        run: python3 scripts/release.py --check
      - name: Test release invariants
        run: python3 scripts/release_test.py
      - name: Install pinned Claude Code validator
        run: npm install --global @anthropic-ai/claude-code@2.1.260
      - name: Validate Claude plugin and marketplace manifests
        run: |
          claude plugin validate --strict plugins/tradingsignal
          claude plugin validate --strict .claude-plugin/marketplace.json
