name: Validate Skill release

on:
  pull_request:
  push:
    branches: [main]

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify version, package copy, and content digest
        run: python3 scripts/release.py --check
      - name: Test release invariants
        run: python3 scripts/release_test.py
